<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>智能记忆助手</title>
    <style>
      :root { --bg:#f5f7fb; --surface:#fff; --surface-muted:#f1f4f9; --text:#1c2536; --muted:#68748a; --border:#e0e6ef; --primary:#5865f2; --primary-hover:#4653db; --primary-text:#fff; --danger:#d84b5b; --shadow:0 10px 28px rgba(35,50,78,.08); --user-bubble:#5865f2; --assistant-bubble:#fff; }
      [data-theme="dark"] { --bg:#121722; --surface:#1d2533; --surface-muted:#273142; --text:#ecf1f8; --muted:#a8b4c7; --border:#344055; --primary:#7c88ff; --primary-hover:#99a2ff; --primary-text:#111522; --danger:#ff7584; --shadow:0 10px 28px rgba(0,0,0,.22); --user-bubble:#6c78fa; --assistant-bubble:#1d2533; }
      * { box-sizing:border-box; }
      body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
      .app-shell { max-width:1440px; margin:0 auto; padding:20px; }
      .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
      h1 { margin:0; font-size:clamp(1.35rem,3vw,1.8rem); }
      .subtitle { color:var(--muted); font-size:.9rem; margin:5px 0 0; }
      button { border:0; border-radius:10px; cursor:pointer; font:inherit; transition:background .2s,transform .2s,opacity .2s; }
      button:hover { transform:translateY(-1px); }
      .theme-toggle { background:var(--surface); color:var(--text); border:1px solid var(--border); padding:9px 12px; }
      .top-actions { display:flex; align-items:center; gap:10px; } .account-name { color:var(--muted); font-size:.85rem; }
      .auth-panel { max-width:420px; margin:10vh auto; padding:24px; } .auth-panel h2 { margin:0 0 8px; }
      .auth-form { display:grid; gap:12px; margin-top:18px; } .auth-form input { padding:12px; color:var(--text); background:var(--surface-muted); border:1px solid var(--border); border-radius:11px; font:inherit; }
      .auth-actions { display:flex; gap:10px; } .auth-actions button { flex:1; padding:11px; color:var(--primary-text); background:var(--primary); }
      .layout { display:grid; grid-template-columns:minmax(0,1.65fr) minmax(300px,.9fr); gap:20px; align-items:stretch; }
      .panel { background:var(--surface); border:1px solid var(--border); border-radius:18px; box-shadow:var(--shadow); }
      .chat-panel { display:flex; flex-direction:column; min-height:calc(100vh - 145px); }
      .chat-history { flex:1; overflow-y:auto; padding:22px; scroll-behavior:smooth; display:flex; flex-direction:column; gap:16px; }
      .empty-chat { color:var(--muted); text-align:center; margin:auto; }
      .message { display:flex; gap:10px; max-width:88%; }
      .message.user { align-self:flex-end; flex-direction:row-reverse; }
      .message.assistant { align-self:flex-start; }
      .avatar { width:30px; height:30px; flex:0 0 30px; display:grid; place-items:center; border-radius:50%; background:var(--surface-muted); font-size:.9rem; }
      .bubble { padding:12px 14px; border-radius:14px; line-height:1.6; white-space:pre-wrap; box-shadow:0 2px 8px rgba(30,40,60,.05); }
      .user .bubble { color:#fff; background:var(--user-bubble); border-bottom-right-radius:3px; }
      .assistant .bubble { background:var(--assistant-bubble); border:1px solid var(--border); border-bottom-left-radius:3px; }
      details { margin-top:10px; padding:8px 10px; background:var(--surface-muted); border-radius:8px; color:var(--muted); font-size:.9rem; }
      summary { cursor:pointer; color:var(--text); font-weight:600; }
      .source-item { margin:8px 0 0; }
      .composer { display:flex; gap:10px; padding:16px; border-top:1px solid var(--border); }
      textarea { flex:1; min-height:46px; max-height:130px; resize:vertical; padding:12px; color:var(--text); background:var(--surface-muted); border:1px solid var(--border); border-radius:11px; font:inherit; }
      .send { align-self:flex-end; padding:12px 18px; color:var(--primary-text); background:var(--primary); }
      .send:hover { background:var(--primary-hover); } .send:disabled { opacity:.6; cursor:wait; transform:none; }
      .memory-panel { padding:18px; min-height:0; }
      .panel-heading { display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; }
      .panel-heading h2 { margin:0; font-size:1.05rem; } .memory-count { color:var(--muted); font-size:.85rem; }
      .memory-list { display:flex; flex-direction:column; gap:11px; max-height:calc(100vh - 190px); overflow-y:auto; }
      .memory-card { padding:14px; background:var(--surface-muted); border:1px solid var(--border); border-radius:12px; }
      .memory-content { margin:0 0 10px; line-height:1.45; font-weight:600; }
      .memory-meta { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
      .memory-tags { display:flex; flex-wrap:wrap; gap:5px; }
      .tag { padding:3px 7px; border-radius:20px; color:var(--primary); background:color-mix(in srgb,var(--primary) 12%,transparent); font-size:.75rem; }
      .memory-time { display:block; margin-top:10px; color:var(--muted); font-size:.78rem; }
      .delete { padding:4px 7px; color:var(--danger); background:transparent; font-size:.82rem; }
      .delete:hover { background:color-mix(in srgb,var(--danger) 12%,transparent); }
      .empty-list { color:var(--muted); text-align:center; padding:26px 10px; } .error { color:var(--danger); font-size:.9rem; margin:0 16px 12px; }
      @media (max-width:820px) { .app-shell { padding:12px; } .layout { grid-template-columns:1fr; } .chat-panel { min-height:62vh; } .memory-list { max-height:44vh; } }
      @media (max-width:480px) { .topbar { align-items:flex-start; } .subtitle { display:none; } .chat-history { padding:15px; } .message { max-width:96%; } .composer { padding:12px; } .send { padding:12px; } }
    </style>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div><h1>智能记忆助手</h1><p class="subtitle">记录、检索并整理属于你的长期记忆</p></div>
        <div class="top-actions"><span id="account-name" class="account-name"></span><button id="logout-button" class="theme-toggle" type="button" hidden>退出</button><button id="theme-toggle" class="theme-toggle" type="button" aria-label="切换深浅色模式">🌙 深色</button></div>
      </header>
      <section id="auth-panel" class="panel auth-panel">
        <h2>登录记忆账户</h2><p class="subtitle">登录后，每个账户拥有独立的长期记忆。</p>
        <p id="auth-error" class="error" hidden></p>
        <form id="auth-form" class="auth-form">
          <input id="auth-email" type="email" autocomplete="email" placeholder="邮箱" required />
          <input id="auth-password" type="password" autocomplete="current-password" minlength="10" maxlength="128" placeholder="密码（至少 10 位）" required />
          <div class="auth-actions"><button id="login-button" type="submit">登录</button><button id="register-button" type="button">注册</button></div>
        </form>
      </section>
      <section id="app-layout" class="layout" hidden>
        <section class="panel chat-panel" aria-label="对话区域">
          <div id="chat-history" class="chat-history"><p class="empty-chat">你好！告诉我需要记住的事，或问问过去记录了什么。</p></div>
          <p id="chat-error" class="error" hidden></p>
          <form id="chat-form" class="composer">
            <textarea id="user-input" placeholder="例如：帮我记住周四洗头，或问：这周有什么安排？" aria-label="输入消息" required></textarea>
            <button id="send-button" class="send" type="submit">发送</button>
          </form>
        </section>
        <aside class="panel memory-panel" aria-label="记忆列表">
          <div class="panel-heading"><h2>已存储的记忆</h2><span id="memory-count" class="memory-count">0 条</span></div>
          <div id="memory-list" class="memory-list"></div>
        </aside>
      </section>
    </main>
    <script>
      // 可通过 ?apiBase=http://localhost:8001 或 localStorage 的 memory-agent-api-base 覆盖地址。
      const configuredBase = new URLSearchParams(window.location.search).get('apiBase') || localStorage.getItem('memory-agent-api-base');
      const currentOrigin = window.location.protocol.startsWith('http') ? window.location.origin : 'http://localhost:8001';
      const API_BASE_URL = (configuredBase || currentOrigin).replace(/\/$/, '');
      let accessToken = localStorage.getItem('memory-agent-access-token') || '';
      let currentConversationId = null;
      const authPanel = document.querySelector('#auth-panel');
      const appLayout = document.querySelector('#app-layout');
      const authForm = document.querySelector('#auth-form');
      const authEmail = document.querySelector('#auth-email');
      const authPassword = document.querySelector('#auth-password');
      const authError = document.querySelector('#auth-error');
      const registerButton = document.querySelector('#register-button');
      const logoutButton = document.querySelector('#logout-button');
      const accountName = document.querySelector('#account-name');
      const chatHistory = document.querySelector('#chat-history');
      const chatForm = document.querySelector('#chat-form');
      const userInput = document.querySelector('#user-input');
      const sendButton = document.querySelector('#send-button');
      const chatError = document.querySelector('#chat-error');
      const memoryList = document.querySelector('#memory-list');
      const memoryCount = document.querySelector('#memory-count');
      const themeToggle = document.querySelector('#theme-toggle');
      const scrollChatToBottom = () => { chatHistory.scrollTop = chatHistory.scrollHeight; };
      function showError(message) { chatError.textContent = message; chatError.hidden = false; }
      function clearError() { chatError.hidden = true; chatError.textContent = ''; }
      async function request(path, options = {}) {
        const headers = new Headers(options.headers || {});
        if (accessToken) headers.set('Authorization', `Bearer ${accessToken}`);
        options.headers = headers;
        const response = await fetch(`${API_BASE_URL}${path}`, options);
        let data; try { data = await response.json(); } catch { data = {}; }
        if (response.status === 401 && !path.startsWith('/api/auth/')) showAuth();
        if (!response.ok) throw new Error(data.detail || '请求失败，请稍后重试。');
        return data;
      }
      function showAuth(message = '') {
        accessToken = ''; currentConversationId = null; localStorage.removeItem('memory-agent-access-token');
        authPanel.hidden = false; appLayout.hidden = true; logoutButton.hidden = true; accountName.textContent = '';
        authError.textContent = message; authError.hidden = !message;
      }
      function showApp(user) {
        authPanel.hidden = true; appLayout.hidden = false; logoutButton.hidden = false; accountName.textContent = user.email;
        loadMemories(); userInput.focus();
      }
      async function authenticate(mode) {
        authError.hidden = true;
        try {
          const result = await request(`/api/auth/${mode}`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: authEmail.value.trim(), password: authPassword.value }),
          });
          accessToken = result.access_token; localStorage.setItem('memory-agent-access-token', accessToken);
          authPassword.value = ''; showApp(result.user);
        } catch (error) { authError.textContent = error.message; authError.hidden = false; }
      }
      function addMessage(role, text, sourceMemories = []) {
        chatHistory.querySelector('.empty-chat')?.remove();
        const message = document.createElement('article');
        message.className = `message ${role}`;
        const avatar = document.createElement('span');
        avatar.className = 'avatar'; avatar.textContent = role === 'user' ? '你' : '忆';
        const bubble = document.createElement('div');
        bubble.className = 'bubble'; bubble.textContent = text;
        message.append(avatar, bubble);
        if (role === 'assistant' && sourceMemories.length) {
          const details = document.createElement('details');
          const summary = document.createElement('summary');
          summary.textContent = `【原始记录】（${sourceMemories.length} 条）`;
          details.append(summary);
          sourceMemories.forEach((memory) => {
            const item = document.createElement('div');
            item.className = 'source-item';
            item.textContent = `[${memory.created_at || '未知时间'}] ${memory.content}`;
            details.append(item);
          });
          bubble.append(details);
        }
        chatHistory.append(message); scrollChatToBottom();
      }
      function answerWithoutSources(answer) { return answer.split('【原始记录】')[0].trim() || answer; }
      function renderMemories(memories) {
        memoryList.replaceChildren(); memoryCount.textContent = `${memories.length} 条`;
        if (!memories.length) {
          const empty = document.createElement('p');
          empty.className = 'empty-list'; empty.textContent = '还没有记忆，开始聊聊吧。';
          memoryList.append(empty); return;
        }
        memories.forEach((memory) => {
          const card = document.createElement('article'); card.className = 'memory-card';
          const content = document.createElement('p'); content.className = 'memory-content'; content.textContent = memory.content;
          const meta = document.createElement('div'); meta.className = 'memory-meta';
          const tags = document.createElement('div'); tags.className = 'memory-tags';
          (memory.tags || '').split(',').filter(Boolean).forEach((tagName) => {
            const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = tagName.trim(); tags.append(tag);
          });
          const deleteButton = document.createElement('button');
          deleteButton.type = 'button'; deleteButton.className = 'delete'; deleteButton.textContent = '删除';
          deleteButton.addEventListener('click', async () => {
            if (!window.confirm('确定删除这条记忆吗？')) return;
            try { await request(`/api/memory/${memory.id}`, { method: 'DELETE' }); await loadMemories(); }
            catch (error) { showError(error.message); }
          });
          meta.append(tags, deleteButton);
          const time = document.createElement('time'); time.className = 'memory-time'; time.textContent = memory.created_at || '未知时间';
          card.append(content, meta, time); memoryList.append(card);
        });
      }
      async function loadMemories() {
        try { renderMemories(await request('/api/memories?limit=100&offset=0')); }
        catch (error) { memoryList.textContent = '加载记忆失败。'; showError(error.message); }
      }
      chatForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const input = userInput.value.trim(); if (!input) return;
        clearError(); addMessage('user', input); userInput.value = '';
        sendButton.disabled = true; sendButton.textContent = '思考中…';
        try {
          const result = await request('/api/memory/auto', {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ input, conversation_id: currentConversationId }),
          });
          currentConversationId = result.conversation_id || currentConversationId;
          if (result.success && result.memory_id) {
            addMessage('assistant', `已记住：${input}`); await loadMemories();
          } else {
            addMessage('assistant', answerWithoutSources(result.answer || '暂时没有找到答案。'), result.source_memories || []);
          }
        } catch (error) {
          showError(error.message); addMessage('assistant', '抱歉，这次请求没有成功，请稍后再试。');
        } finally {
          sendButton.disabled = false; sendButton.textContent = '发送'; userInput.focus();
        }
      });
      function setTheme(theme) {
        document.documentElement.dataset.theme = theme; localStorage.setItem('memory-agent-theme', theme);
        themeToggle.textContent = theme === 'dark' ? '☀️ 浅色' : '🌙 深色';
      }
      themeToggle.addEventListener('click', () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));
      authForm.addEventListener('submit', (event) => { event.preventDefault(); authenticate('login'); });
      registerButton.addEventListener('click', () => authenticate('register'));
      logoutButton.addEventListener('click', async () => { try { await request('/api/auth/logout', { method: 'POST' }); } finally { showAuth(); } });
      setTheme(localStorage.getItem('memory-agent-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
      if (accessToken) request('/api/auth/me').then(showApp).catch(() => showAuth('登录已过期，请重新登录。')); else showAuth();
    </script>
  </body>
</html>
