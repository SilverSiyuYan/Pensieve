<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 冥想盆</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: linear-gradient(135deg, #4a6fa5, #6b8fc7);
    height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .box {
    background: #fff; border-radius: 16px; padding: 36px 32px;
    width: 340px; box-shadow: 0 8px 32px rgba(0,0,0,.2);
  }
  h1 { font-size: 22px; text-align: center; color: #333; }
  .sub { text-align: center; color: #999; font-size: 12px; margin: 8px 0 24px; }
  .tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid #eee; }
  .tab {
    flex: 1; text-align: center; padding: 8px; cursor: pointer;
    color: #999; font-size: 15px; border-bottom: 2px solid transparent;
    margin-bottom: -2px;
  }
  .tab.active { color: #4a6fa5; border-bottom-color: #4a6fa5; font-weight: 600; }
  input {
    width: 100%; padding: 11px 14px; margin-bottom: 12px;
    border: 1px solid #d9dee6; border-radius: 8px; font-size: 14px; outline: none;
  }
  input:focus { border-color: #4a6fa5; }
  button {
    width: 100%; padding: 11px; background: #4a6fa5; color: #fff;
    border: none; border-radius: 8px; font-size: 15px; cursor: pointer;
  }
  button:hover { background: #3d5d8c; }
  #err { color: #d4380d; font-size: 13px; text-align: center; min-height: 20px; margin-top: 10px; }
</style>
</head>
<body>
<div class="box">
  <h1>🧠 冥想盆</h1>
  <div class="sub">你的私人长期记忆库 · 只答存过的，没有就说没有</div>
  <div class="tabs">
    <div class="tab active" id="tab-login" onclick="switchTab('login')">登录</div>
    <div class="tab" id="tab-register" onclick="switchTab('register')">注册</div>
  </div>
  <input id="username" placeholder="用户名（至少 2 个字符）" autocomplete="username">
  <input id="password" type="password" placeholder="密码（至少 4 位）" autocomplete="current-password">
  <button id="go" onclick="submit()">登 录</button>
  <div id="err"></div>
</div>

<script>
let mode = 'login';

function switchTab(m) {
  mode = m;
  document.getElementById('tab-login').classList.toggle('active', m === 'login');
  document.getElementById('tab-register').classList.toggle('active', m === 'register');
  document.getElementById('go').textContent = m === 'login' ? '登 录' : '注册并进入';
  document.getElementById('err').textContent = '';
}

async function submit() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const err = document.getElementById('err');
  const res = await fetch('/api/' + mode, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, password }),
  });
  const data = await res.json();
  if (data.ok) {
    location.href = '/';
  } else {
    err.textContent = data.error || '操作失败，请重试';
  }
}

document.getElementById('password').addEventListener('keydown', e => {
  if (e.key === 'Enter') submit();
});
</script>
</body>
</html>
