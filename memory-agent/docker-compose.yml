services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: pensieve-memory-agent:local
    env_file:
      - ./backend/.env
    volumes:
      - memory_data:/data
    expose:
      - "8000"
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  frontend:
    image: nginx:1.27-alpine
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/config.docker.js:/usr/share/nginx/html/config.js:ro
      - ./frontend/api-runtime.js:/usr/share/nginx/html/api-runtime.js:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  memory_data:
