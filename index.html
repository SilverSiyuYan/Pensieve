<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>冥想盆 · 长期记忆智能体</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #f0f2f5; height: 100vh;
    display: flex; flex-direction: column;
  }
  header {
    background: linear-gradient(135deg, #4a6fa5, #6b8fc7);
    color: #fff; padding: 14px 20px;
    display: flex; align-items: center; justify-content: space-between;
    box-shadow: 0 2px 8px rgba(0,0,0,.1);
  }
  header h1 { font-size: 18px; font-weight: 600; }
  header .sub { font-size: 12px; opacity: .85; margin-top: 2px; }
  .mem-btn {
    background: rgba(255,255,255,.2); color: #fff; border: none;
    padding: 6px 14px; border-radius: 16px; cursor: pointer; font-size: 13px;
  }
  .mem-btn:hover { background: rgba(255,255,255,.35); }
  #who { font-size: 13px; opacity: .9; margin-right: 4px; }
  .header-right { display: flex; align-items: center; gap: 8px; }
  #chat {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 12px;
    max-width: 860px; width: 100%; margin: 0 auto;
  }
  .msg { display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble {
    max-width: 75%; padding: 10px 14px; border-radius: 12px;
    line-height: 1.6; font-size: 14px; white-space: pre-wrap;
    word-break: break-word; box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  .msg.user .bubble { background: #4a6fa5; color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot .bubble { background: #fff; color: #333; border-bottom-left-radius: 4px; }
  .msg.bot .bubble.refuse { background: #fff7e6; border: 1px solid #ffd591; color: #ad6800; }
  .card {
    max-width: 75%; background: #fff; border-left: 4px solid #52c41a;
    border-radius: 8px; padding: 10px 14px; font-size: 13px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08); line-height: 1.7;
  }
  .card .title { font-weight: 600; color: #389e0d; margin-bottom: 4px; }
  .card .meta { color: #888; font-size: 12px; }
  .src-card {
    max-width: 75%; background: #f8f9fb; border: 1px solid #e5e9f0;
    border-radius: 8px; padding: 8px 12px; font-size: 12.5px; color: #555;
    line-height: 1.6;
  }
  .src-card .head { color: #4a6fa5; font-weight: 600; margin-bottom: 2px; }
  .src-label { font-size: 12px; color: #999; margin: 4px 0 -6px 4px; }
  .tag {
    display: inline-block; background: #e6f0ff; color: #4a6fa5;
    border-radius: 4px; padding: 1px 6px; font-size: 11px; margin-right: 4px;
  }
  #input-bar {
    background: #fff; padding: 12px 16px;
    display: flex; gap: 10px; align-items: flex-end;
    box-shadow: 0 -2px 8px rgba(0,0,0,.06);
  }
  #input-wrap { max-width: 860px; width: 100%; margin: 0 auto; display: flex; gap: 10px; }
  #input {
    flex: 1; border: 1px solid #d9dee6; border-radius: 10px;
    padding: 10px 14px; font-size: 14px; resize: none; outline: none;
    font-family: inherit; max-height: 120px;
  }
  #input:focus { border-color: #4a6fa5; }
  #send {
    background: #4a6fa5; color: #fff; border: none; border-radius: 10px;
    padding: 10px 22px; font-size: 14px; cursor: pointer;
  }
  #send:hover { background: #3d5d8c; }
  #hint {
    text-align: center; font-size: 12px; color: #aaa; padding: 6px;
    background: #fff;
  }
  .thinking { color: #999; font-style: italic; }
</style>
</head>
<body>
<header>
  <div>
    <h1>🧠 冥想盆 · 长期记忆智能体</h1>
    <div class="sub">随口存，随时问 —— 只答存过的，没有就说没有</div>
  </div>
  <div class="header-right">
    <span id="who"></span>
    <button class="mem-btn" onclick="showMemories()">📚 记忆库</button>
    <button class="mem-btn" onclick="logout()">退出</button>
  </div>
</header>

<div id="chat"></div>

<div id="input-bar">
  <div id="input-wrap">
    <textarea id="input" rows="1"
      placeholder="直接发送 = 存入记忆；带疑问词 = 查询记忆；「记住：」开头 = 强制存入"></textarea>
    <button id="send" onclick="send()">发送</button>
  </div>
</div>
<div id="hint">Enter 发送 · Shift+Enter 换行</div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');

// 页面加载时确认登录状态并显示用户名
fetch('/api/me').then(r => r.json()).then(d => {
  if (d.login) document.getElementById('who').textContent = '👤 ' + d.username;
}).catch(() => {});

async function logout() {
  await fetch('/api/logout', { method: 'POST' });
  location.href = '/';
}

input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s ?? '';
  return d.innerHTML;
}

function addBubble(role, text, cls = '') {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = `<div class="bubble ${cls}">${esc(text)}</div>`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function addEl(html) {
  const div = document.createElement('div');
  div.innerHTML = html;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function tagsHtml(tags) {
  return (tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('');
}

async function send() {
  const msg = input.value.trim();
  if (!msg) return;
  addBubble('user', msg);
  input.value = '';
  const thinking = addBubble('bot', '正在翻找记忆……', 'thinking');
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg }),
    });
    if (res.status === 401) { location.href = '/'; return; }
    const data = await res.json();
    thinking.remove();

    if (data.type === 'added') {
      if (!data.ok) { addBubble('bot', data.answer); return; }
      addEl(`<div class="card">
        <div class="title">✅ 已存入记忆 #${data.id}</div>
        <div>摘要：${esc(data.summary)}</div>
        <div class="meta">${tagsHtml(data.tags)}
          日期：${esc(data.event_date || '无')} · 人物：${esc((data.people || []).join('、') || '无')}</div>
      </div>`);
    } else {
      if (!data.found) {
        addBubble('bot', '🚫 ' + data.answer, 'refuse');
      } else {
        addBubble('bot', data.answer || '找到以下相关记录：');
        if (data.sources && data.sources.length) {
          addEl('<div class="src-label">—— 出处（可逐字核对）——</div>');
          data.sources.forEach(s => {
            addEl(`<div class="src-card">
              <div class="head">记忆 #${s.id} · ${esc(s.created_at)} · ${tagsHtml(s.tags)}</div>
              <div>${esc(s.content)}</div>
            </div>`);
          });
        }
      }
    }
  } catch (err) {
    thinking.remove();
    addBubble('bot', '⚠️ 服务出错了：' + err.message, 'refuse');
  }
}

async function showMemories() {
  const res = await fetch('/api/memories');
  if (res.status === 401) { location.href = '/'; return; }
  const list = await res.json();
  if (!list.length) { addBubble('bot', '记忆库还是空的，先存点什么吧！'); return; }
  addBubble('bot', `📚 记忆库中最近 ${list.length} 条记录：`);
  list.forEach(s => {
    addEl(`<div class="src-card">
      <div class="head">#${s.id} · ${esc(s.created_at)} · ${tagsHtml(s.tags)}</div>
      <div>${esc(s.content.slice(0, 120))}</div>
    </div>`);
  });
}

// 欢迎语
addBubble('bot', '你好，我是冥想盆。把任何想记住的事随手发给我（自动打标、长期保存）；' +
  '想问什么直接问，我只根据存过的原文回答，没有就直说没有。\n\n' +
  '试试：「下周三下午3点开项目周会」→ 再问我「周会什么时候开？」');
</script>
</body>
</html>
