<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>智能记忆助手</title>
    <style>
      :root { --bg:#f5f7fb; --surface:#fff; --surface-muted:#f1f4f9; --text:#1c2536; --muted:#68748a; --border:#e0e6ef; --primary:#5865f2; --primary-hover:#4653db; --primary-text:#fff; --danger:#d84b5b; --shadow:0 10px 28px rgba(35,50,78,.08); --user-bubble:#5865f2; --assistant-bubble:#fff; }
      [data-theme="dark"] { --bg:#121722; --surface:#1d2533; --surface-muted:#273142; --text:#ecf1f8; --muted:#a8b4c7; --border:#344055; --primary:#7c88ff; --primary-hover:#99a2ff; --primary-text:#111522; --danger:#ff7584; --shadow:0 10px 28px rgba(0,0,0,.22); --user-bubble:#6c78fa; --assistant-bubble:#1d2533; }
      * { box-sizing:border-box; }
      body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
      .app-shell { max-width:1440px; margin:0 auto; padding:20px; }
      .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
      h1 { margin:0; font-size:clamp(1.35rem,3vw,1.8rem); }
      .subtitle { color:var(--muted); font-size:.9rem; margin:5px 0 0; }
      button { border:0; border-radius:10px; cursor:pointer; font:inherit; transition:background .2s,transform .2s,opacity .2s; }
      button:hover { transform:translateY(-1px); }
      .theme-toggle { background:var(--surface); color:var(--text); border:1px solid var(--border); padding:9px 12px; }
      .top-actions { display:flex; align-items:center; gap:10px; } .account-name { color:var(--muted); font-size:.85rem; }
      .auth-panel { max-width:420px; margin:10vh auto; padding:24px; } .auth-panel h2 { margin:0 0 8px; }
      .auth-form { display:grid; gap:12px; margin-top:18px; } .auth-form input { padding:12px; color:var(--text); background:var(--surface-muted); border:1px solid var(--border); border-radius:11px; font:inherit; }
      .auth-actions { display:flex; gap:10px; } .auth-actions button { flex:1; padding:11px; color:var(--primary-text); background:var(--primary); }
      .layout { display:grid; grid-template-columns:minmax(0,1.65fr); gap:20px; align-items:stretch; }
      #app-layout { display:grid; }
      #calendar-view { display:none; }
      #calendar-view.active { display:grid; }
      .panel { background:var(--surface); border:1px solid var(--border); border-radius:18px; box-shadow:var(--shadow); }
      .chat-panel { display:flex; flex-direction:column; min-height:calc(100vh - 145px); }
      .chat-history { flex:1; overflow-y:auto; padding:22px; scroll-behavior:smooth; display:flex; flex-direction:column; gap:16px; }
      .empty-chat { color:var(--muted); text-align:center; margin:auto; }
      .message { display:flex; gap:10px; max-width:88%; }
      .message.user { align-self:flex-end; flex-direction:row-reverse; }
      .message.assistant { align-self:flex-start; }
      .avatar { width:30px; height:30px; flex:0 0 30px; display:grid; place-items:center; border-radius:50%; background:var(--surface-muted); font-size:.9rem; }
      .bubble { padding:12px 14px; border-radius:14px; line-height:1.6; white-space:pre-wrap; box-shadow:0 2px 8px rgba(30,40,60,.05); }
      .user .bubble { color:#fff; background:var(--user-bubble); border-bottom-right-radius:3px; }
      .assistant .bubble { background:var(--assistant-bubble); border:1px solid var(--border); border-bottom-left-radius:3px; }
      details { margin-top:10px; padding:8px 10px; background:var(--surface-muted); border-radius:8px; color:var(--muted); font-size:.9rem; }
      summary { cursor:pointer; color:var(--text); font-weight:600; }
      .source-item { margin:8px 0 0; }
      .rendering-results { display:grid; gap:9px; margin-top:10px; }
      .rendering-result { padding:9px 10px; background:var(--surface-muted); border-radius:9px; white-space:normal; }
      .rendering-result-title { margin:0 0 4px; font-size:.92rem; line-height:1.4; }
      .rendering-result-summary { margin:0 0 6px; color:var(--text); font-size:.85rem; line-height:1.5; }
      .rendering-result-meta { display:flex; flex-wrap:wrap; align-items:center; gap:8px; color:var(--muted); font-size:.76rem; }
      .rendering-result-link { color:var(--primary); font-weight:600; }
      .rendering-empty { margin:8px 0 0; color:var(--muted); font-size:.84rem; }
      .composer { display:grid; gap:10px; padding:16px; border-top:1px solid var(--border); }
      .composer-row { display:flex; gap:10px; align-items:flex-end; }
      .rendering-option { display:flex; align-items:center; gap:7px; min-height:26px; color:var(--muted); font-size:.84rem; }
      .rendering-option label { display:flex; align-items:center; gap:7px; cursor:pointer; }
      .rendering-option input { width:16px; height:16px; margin:0; accent-color:var(--primary); }
      .rendering-option input:disabled + span { opacity:.65; }
      .tooltip-wrap { position:relative; display:inline-flex; }
      .rendering-help { width:22px; height:22px; padding:0; color:var(--muted); background:var(--surface-muted); border:1px solid var(--border); border-radius:50%; font-size:.76rem; font-weight:700; }
      .rendering-help:hover,.rendering-help:focus-visible { color:var(--primary); outline:2px solid color-mix(in srgb,var(--primary) 35%,transparent); outline-offset:2px; transform:none; }
      .rendering-tooltip { position:absolute; z-index:10; left:0; bottom:calc(100% + 8px); width:min(330px,calc(100vw - 48px)); padding:9px 11px; color:var(--text); background:var(--surface); border:1px solid var(--border); border-radius:9px; box-shadow:var(--shadow); font-size:.8rem; line-height:1.5; opacity:0; visibility:hidden; pointer-events:none; transition:opacity .15s,visibility .15s; }
      .tooltip-wrap:hover .rendering-tooltip,.tooltip-wrap:focus-within .rendering-tooltip,.tooltip-wrap.open .rendering-tooltip { opacity:1; visibility:visible; }
      textarea { flex:1; min-height:46px; max-height:130px; resize:vertical; padding:12px; color:var(--text); background:var(--surface-muted); border:1px solid var(--border); border-radius:11px; font:inherit; }
      .send { align-self:flex-end; padding:12px 18px; color:var(--primary-text); background:var(--primary); }
      .send:hover { background:var(--primary-hover); } .send:disabled { opacity:.6; cursor:wait; transform:none; }
      .memory-panel { padding:18px; min-height:0; }
      .panel-heading { display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; }
      .panel-heading h2 { margin:0; font-size:1.05rem; } .memory-count { color:var(--muted); font-size:.85rem; }
      .memory-controls { display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-bottom:13px; }
      .memory-control { display:grid; gap:5px; color:var(--muted); font-size:.76rem; }
      .memory-control select { width:100%; padding:8px 9px; color:var(--text); background:var(--surface-muted); border:1px solid var(--border); border-radius:9px; font:inherit; }
      .memory-list { display:flex; flex-direction:column; gap:11px; max-height:calc(100vh - 190px); overflow-y:auto; }
      .memory-card { padding:14px; background:var(--surface-muted); border:1px solid var(--border); border-radius:12px; }
      .memory-content { margin:0 0 10px; line-height:1.45; font-weight:600; }
      .memory-meta { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
      .memory-tags { display:flex; flex-wrap:wrap; gap:5px; }
      .tag { padding:3px 7px; border-radius:20px; color:var(--primary); background:color-mix(in srgb,var(--primary) 12%,transparent); font-size:.75rem; }
      .category-badge { padding:3px 7px; border-radius:20px; color:var(--primary-text); background:var(--primary); font-size:.75rem; white-space:nowrap; }
      .memory-time { display:block; margin-top:10px; color:var(--muted); font-size:.78rem; }
      .delete { padding:4px 7px; color:var(--danger); background:transparent; font-size:.82rem; }
      .delete:hover { background:color-mix(in srgb,var(--danger) 12%,transparent); }
      .empty-list { color:var(--muted); text-align:center; padding:26px 10px; } .error { color:var(--danger); font-size:.9rem; margin:0 16px 12px; }
      .view-nav { display:flex; gap:5px; padding:4px; background:var(--surface-muted); border-radius:12px; }
      .view-nav button { padding:7px 11px; color:var(--muted); background:transparent; }
      .view-nav button.active { color:var(--primary-text); background:var(--primary); }
      .calendar-view { display:grid; grid-template-columns:1fr; gap:20px; }
      .memory-square-header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; }
      .memory-square-header h2 { margin:0; font-size:1.08rem; }
      .memory-square-mode-switch { display:flex; gap:8px; margin-bottom:18px; padding:4px; background:var(--surface-muted); border:1px solid var(--border); border-radius:12px; }
      .memory-square-mode-switch button { flex:1; padding:9px 12px; color:var(--muted); background:transparent; }
      .memory-square-mode-switch button.active { color:var(--primary-text); background:var(--primary); }
      .memory-square-panel { display:none; }
      .memory-square-panel.active { display:block; }
      #memory-square-calendar.active { display:grid; grid-template-columns:minmax(0,1.4fr) minmax(320px,0.9fr); gap:20px; align-items:start; }
      #memory-square-category.active { display:block; }
      #memory-square-random.active { display:block; }
      .memory-square-category { display:grid; gap:20px; }
      .calendar-panel,.calendar-detail { padding:18px; min-width:0; }
      .calendar-toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; }
      .calendar-toolbar h2 { margin:0; font-size:1.2rem; text-align:center; }
      .calendar-actions { display:flex; gap:7px; }
      .calendar-button { padding:8px 10px; color:var(--text); background:var(--surface-muted); border:1px solid var(--border); }
      .weekday-row,.calendar-grid { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); }
      .weekday { padding:8px 4px; color:var(--muted); text-align:center; font-size:.8rem; font-weight:600; }
      .calendar-grid { border-top:1px solid var(--border); border-left:1px solid var(--border); }
      .calendar-day,.calendar-blank { min-height:96px; padding:8px; border:0; border-right:1px solid var(--border); border-bottom:1px solid var(--border); border-radius:0; background:var(--surface); color:var(--text); text-align:left; }
      .calendar-day:hover { z-index:1; background:var(--surface-muted); transform:none; }
      .calendar-day.today .day-number { color:var(--primary-text); background:var(--primary); }
      .calendar-day.selected { z-index:1; outline:2px solid var(--primary); outline-offset:-2px; background:color-mix(in srgb,var(--primary) 8%,var(--surface)); }
      .day-number { display:grid; width:28px; height:28px; place-items:center; border-radius:50%; font-weight:700; }
      .day-counts { display:flex; flex-direction:column; align-items:flex-start; gap:4px; margin-top:7px; }
      .day-count { padding:2px 5px; border-radius:6px; color:var(--muted); background:var(--surface-muted); font-size:.68rem; white-space:nowrap; }
      .day-count.mentioned { color:var(--primary); }
      .calendar-status { color:var(--muted); text-align:center; padding:28px 8px; }
      .calendar-detail-heading { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; }
      .calendar-detail-heading h2 { margin:0; font-size:1.05rem; }
      .calendar-sort { padding:7px 8px; color:var(--text); background:var(--surface-muted); border:1px solid var(--border); border-radius:9px; }
      .calendar-section + .calendar-section { margin-top:20px; padding-top:18px; border-top:1px solid var(--border); }
      .calendar-section h3 { margin:0 0 10px; font-size:.95rem; }
      .calendar-memory-list { display:flex; flex-direction:column; gap:10px; }
      .calendar-memory { padding:12px; background:var(--surface-muted); border:1px solid var(--border); border-radius:12px; }
      .calendar-memory p { margin:0 0 9px; line-height:1.45; }
      .calendar-memory-footer { display:flex; flex-wrap:wrap; align-items:center; gap:7px; color:var(--muted); font-size:.76rem; }
      .date-expression { padding:3px 7px; border-radius:20px; color:var(--primary); background:color-mix(in srgb,var(--primary) 12%,transparent); }
      .random-memory-shell { display:grid; gap:16px; }
      .random-memory-stage { position:relative; min-height:260px; }
      .random-memory-item { position:absolute; inset:0; padding:22px; background:var(--surface); border:1px solid var(--border); border-radius:18px; box-shadow:var(--shadow); opacity:0; transform:scale(.96) translateY(20px); transition:opacity .8s ease, transform .8s ease; pointer-events:none; }
      .random-memory-item.active { opacity:1; transform:scale(1) translateY(0); }
      .random-memory-item.exiting { opacity:0; transform:scale(.98) translateY(-12px); }
      .random-memory-item p { margin:0 0 10px; line-height:1.7; font-size:1.05rem; }
      .random-memory-meta { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
      .random-memory-actions { display:flex; justify-content:flex-end; }
      .random-memory-actions button { padding:9px 12px; color:var(--primary-text); background:var(--primary); }
      @media (max-width:820px) { .app-shell { padding:12px; } .layout,.calendar-view { grid-template-columns:1fr; } .chat-panel { min-height:62vh; } .memory-list { max-height:44vh; } .calendar-day,.calendar-blank { min-height:82px; } }
      @media (max-width:600px) { .topbar { align-items:flex-start; flex-direction:column; } .top-actions { width:100%; flex-wrap:wrap; } .calendar-panel,.calendar-detail { padding:12px; } .calendar-toolbar { align-items:stretch; flex-direction:column; } .calendar-toolbar h2 { order:-1; } .calendar-actions { justify-content:space-between; } .calendar-day,.calendar-blank { min-height:64px; padding:4px; } .day-count { padding:1px 3px; font-size:.58rem; } }
      @media (max-width:480px) { .subtitle { display:none; } .chat-history { padding:15px; } .message { max-width:96%; } .composer { padding:12px; } .rendering-option { position:relative; } .tooltip-wrap { position:static; } .composer-row { align-items:stretch; flex-direction:column; } .send { width:100%; padding:12px; } .rendering-tooltip { left:0; right:auto; width:calc(100vw - 32px); } .memory-controls { grid-template-columns:1fr; } }
    </style>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div><h1>智能记忆助手</h1><p class="subtitle">记录、检索并整理属于你的长期记忆</p></div>
        <div class="top-actions"><nav id="view-nav" class="view-nav" aria-label="主导航" hidden></nav><span id="account-name" class="account-name"></span><button id="logout-button" class="theme-toggle" type="button" hidden>退出</button><button id="theme-toggle" class="theme-toggle" type="button" aria-label="切换深浅色模式">🌙 深色</button></div>
      </header>
      <section id="auth-panel" class="panel auth-panel">
        <h2>登录记忆账户</h2><p class="subtitle">登录后，每个账户拥有独立的长期记忆。</p>
        <p id="auth-error" class="error" hidden></p>
        <form id="auth-form" class="auth-form">
          <input id="auth-email" type="email" autocomplete="email" placeholder="邮箱" required />
          <input id="auth-password" type="password" autocomplete="current-password" minlength="10" maxlength="128" placeholder="密码（至少 10 位）" required />
          <div class="auth-actions"><button id="login-button" type="submit">登录</button><button id="register-button" type="button">注册</button></div>
        </form>
      </section>
      <section id="app-layout" class="layout view-panel active" hidden>
        <section class="panel chat-panel" aria-label="对话区域">
          <div id="chat-history" class="chat-history"><p class="empty-chat">你好！告诉我需要记住的事，或问问过去记录了什么。</p></div>
          <p id="chat-error" class="error" hidden></p>
          <form id="chat-form" class="composer">
            <div class="rendering-option">
              <label for="inspiration-rendering-toggle"><input id="inspiration-rendering-toggle" type="checkbox" /><span>灵感渲染</span></label>
              <span id="inspiration-rendering-tooltip-wrap" class="tooltip-wrap">
                <button id="inspiration-rendering-help" class="rendering-help" type="button" aria-label="了解灵感渲染" aria-describedby="inspiration-rendering-tooltip" aria-expanded="false">?</button>
                <span id="inspiration-rendering-tooltip" class="rendering-tooltip" role="tooltip">开启后，会将本次灵感发送至联网检索服务，搜索并概括 5 条高相关资料与来源链接，用于拓宽思路；关闭时仍按原流程记录。</span>
              </span>
            </div>
            <div class="composer-row"><textarea id="user-input" placeholder="例如：帮我记住周四洗头，或问：这周有什么安排？" aria-label="输入消息" required></textarea><button id="send-button" class="send" type="submit">发送</button></div>
          </form>
        </section>
      </section>
      <section id="calendar-view" class="calendar-view view-panel" hidden>
        <div class="memory-square-header">
          <h2>记忆广场</h2>
        </div>
        <div class="memory-square-mode-switch" id="memory-square-mode-switch" aria-label="记忆广场呈现方式">
          <button class="active" type="button" data-mode="calendar">日历</button>
          <button type="button" data-mode="category">分类</button>
          <button type="button" data-mode="random">随机</button>
        </div>
        <section id="memory-square-calendar" class="memory-square-panel active" aria-label="记忆广场日历模式">
          <section class="panel calendar-panel" aria-label="月历">
            <div class="calendar-toolbar">
              <div class="calendar-actions"><button id="calendar-previous" class="calendar-button" type="button">上个月</button><button id="calendar-today" class="calendar-button" type="button">今天</button></div>
              <h2 id="calendar-title"></h2>
              <div class="calendar-actions"><button id="calendar-next" class="calendar-button" type="button">下个月</button></div>
            </div>
            <div class="weekday-row" aria-hidden="true"><span class="weekday">周一</span><span class="weekday">周二</span><span class="weekday">周三</span><span class="weekday">周四</span><span class="weekday">周五</span><span class="weekday">周六</span><span class="weekday">周日</span></div>
            <div id="calendar-status" class="calendar-status">正在加载月历…</div>
            <div id="calendar-grid" class="calendar-grid" hidden></div>
          </section>
          <aside class="panel calendar-detail" aria-label="日期详情">
            <div class="calendar-detail-heading"><h2 id="calendar-detail-title">请选择日期</h2><select id="calendar-sort-order" class="calendar-sort" aria-label="日历记忆排序"><option value="desc">从近到远</option><option value="asc">从远到近</option></select></div>
            <div id="calendar-detail-status" class="calendar-status">点击月历中的日期查看详情。</div>
            <div id="calendar-detail-content" hidden>
              <section class="calendar-section"><h3>当天写入 <span id="created-memory-count"></span></h3><div id="created-memory-list" class="calendar-memory-list"></div></section>
              <section class="calendar-section"><h3>内容提及当天 <span id="mentioned-memory-count"></span></h3><div id="mentioned-memory-list" class="calendar-memory-list"></div></section>
            </div>
          </aside>
        </section>
        <section id="memory-square-category" class="memory-square-panel" aria-label="记忆广场分类模式" hidden>
          <div class="panel memory-panel memory-square-category">
            <div class="panel-heading"><h2>已存储的记忆</h2><span id="memory-count" class="memory-count">0 条</span></div>
            <div class="memory-controls">
              <label class="memory-control">分类
                <select id="memory-category" aria-label="按分类筛选记忆">
                  <option value="">全部</option><option value="inspiration">灵感</option><option value="todo">待办</option><option value="knowledge">知识点</option><option value="note">便签</option>
                </select>
              </label>
              <label class="memory-control">创建时间
                <select id="memory-sort-order" aria-label="按创建时间排序">
                  <option value="desc">从近到远</option><option value="asc">从远到近</option>
                </select>
              </label>
            </div>
            <div id="memory-list" class="memory-list"></div>
          </div>
        </section>
        <section id="memory-square-random" class="memory-square-panel" aria-label="记忆广场随机模式" hidden>
          <div class="panel memory-panel random-memory-shell">
            <div class="random-memory-actions"><button id="random-memory-refresh" type="button">换一个</button></div>
            <div id="random-memory-display" class="random-memory-stage" aria-live="polite"></div>
          </div>
        </section>
      </section>
    </main>
    <script src="config.js?v=0.2.0-timeout-fix"></script>
    <script src="api-runtime.js?v=0.2.0-inspiration-errors"></script>
    <script>
      const { ApiError, resolveApiBase: resolveConfiguredApiBase, transportError, parseJsonResponse, validateHealthResponse, createAutoMemoryPayload } = window.MemoryAgentApi;
      // 唯一优先级：?apiBase → 项目 config.js → 同源默认地址。
      const projectApiBase = window.MEMORY_AGENT_CONFIG?.apiBase;
      let apiBaseUrl;
      let apiResolutionError = null;
      try { apiBaseUrl = resolveConfiguredApiBase(window.location.href, projectApiBase); }
      catch (error) { apiResolutionError = error; }
      const fetchWithTimeout = async (url, options = {}, timeoutMs = 10000) => {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs);
        try { return await fetch(url, { ...options, signal: controller.signal }); }
        catch (error) {
          if (error.name === 'AbortError') throw new ApiError('timeout', `请求超时（${timeoutMs / 1000} 秒）：${url}`);
          throw error;
        }
        finally { clearTimeout(timer); }
      };
      const networkError = (error) => transportError(error, apiBaseUrl, window.location.origin, 2500);
      let applicationTimezone = window.MEMORY_AGENT_CONFIG?.timezone || 'Asia/Shanghai';
      const verifyApiAvailability = async () => {
        if (apiResolutionError) throw apiResolutionError;
        const healthUrl = `${apiBaseUrl}/api/health`;
        let response;
        try { response = await fetchWithTimeout(healthUrl, { cache: 'no-store' }, 2500); }
        catch (error) {
          if (error instanceof ApiError) throw error;
          throw networkError(error);
        }
        const health = validateHealthResponse(await parseJsonResponse(response));
        applicationTimezone = health.timezone;
        return apiBaseUrl;
      };
      let apiReady = null;
      const ensureApiReady = async () => {
        if (!apiReady) apiReady = verifyApiAvailability();

        container.replaceChildren();
        if (!memories.length) { const empty = document.createElement('p'); empty.className = 'empty-list'; empty.textContent = emptyText; container.append(empty); return; }
        memories.forEach((memory) => container.append(renderCalendarMemory(memory, includeExpressions)));
      }
      function renderCalendarDay(payload) {
        calendarDetailTitle.textContent = `${payload.date} 详情`;
        createdMemoryCount.textContent = `（${payload.created_memories.length} 条）`;
        mentionedMemoryCount.textContent = `（${payload.mentioned_memories.length} 条）`;
        renderCalendarGroup(createdMemoryList, payload.created_memories, '当天没有写入记忆。', false);
        renderCalendarGroup(mentionedMemoryList, payload.mentioned_memories, '没有记忆提及当天。', true);
        calendarDetailStatus.hidden = true; calendarDetailContent.hidden = false;
      }
      async function loadCalendarDay(dateKey) {
        const requestId = ++calendarDayRequestId;
        calendarDetailContent.hidden = true; calendarDetailStatus.hidden = false; calendarDetailStatus.textContent = '正在加载当天详情…';
        try {
          const payload = await request(`/api/calendar/day?date=${dateKey}&sort_order=${calendarSortOrder.value}`);
          if (requestId === calendarDayRequestId) renderCalendarDay(payload);
        } catch (error) {
          if (requestId === calendarDayRequestId) calendarDetailStatus.textContent = `当天详情加载失败：${error.message}`;
        }
      }
      function selectCalendarDay(dateKey) {
        selectedCalendarDate = dateKey;
        if (calendarMonthPayload) renderCalendarMonth(calendarMonthPayload);
        loadCalendarDay(dateKey);
      }
      function shiftCalendarMonth(delta) {
        const nextIndex = calendarYear * 12 + (calendarMonth - 1) + delta;
        const nextYear = Math.floor(nextIndex / 12); const nextMonth = (nextIndex % 12 + 12) % 12 + 1;
        if (nextYear < 1 || nextYear > 9998) return;
        calendarYear = nextYear; calendarMonth = nextMonth; selectedCalendarDate = '';
        calendarDetailTitle.textContent = '请选择日期'; calendarDetailContent.hidden = true; calendarDetailStatus.hidden = false; calendarDetailStatus.textContent = '点击月历中的日期查看详情。';
        loadCalendarMonth();
      }
      userInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          chatForm.requestSubmit();
        }
      });
      chatForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        if (memorySubmissionPending) return;
        const input = userInput.value.trim(); if (!input) return;
        const renderingRequested = inspirationRenderingToggle.checked === true;
        const requestPayload = createAutoMemoryPayload(input, currentConversationId, renderingRequested);
        clearError(); addMessage('user', input); userInput.value = '';
        memorySubmissionPending = true; chatForm.setAttribute('aria-busy', 'true');
        sendButton.disabled = true; inspirationRenderingToggle.disabled = true;
        sendButton.textContent = renderingRequested ? '正在保存并检索相关灵感…' : '思考中…';
        try {
          const result = await request('/api/memory/auto', {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(requestPayload),
          }, 120000);
          currentConversationId = result.conversation_id || currentConversationId;
          if (result.success && result.memory_id) {
            if (renderingRequested) {
              let rendering = result.inspiration_rendering;
              if (!rendering) {
                try { rendering = await request(`/api/memories/${result.memory_id}/inspiration-rendering`); }
                catch (error) { console.warn('Unable to recover inspiration rendering status', error); }
              }
              addMessage('assistant', renderingMessage(rendering), [], rendering);
            }
            else addMessage('assistant', `已记住：${input}`);
            await loadMemories();
          } else {
            addMessage('assistant', answerWithoutSources(result.answer || '暂时没有找到答案。'), result.source_memories || []);
          }
        } catch (error) {
          if (error instanceof ApiError && error.kind === 'auth') {
            showAuth('登录已失效，请重新登录。');
          } else {
            const message = memorySaveFailureMessage(error);
            showError(message); addMessage('assistant', message);
          }
        } finally {
          memorySubmissionPending = false; chatForm.removeAttribute('aria-busy');
          sendButton.disabled = false; inspirationRenderingToggle.disabled = false; sendButton.textContent = '发送'; userInput.focus();
        }
      });
      function setTheme(theme) {
        document.documentElement.dataset.theme = theme; localStorage.setItem('memory-agent-theme', theme);
        themeToggle.textContent = theme === 'dark' ? '☀️ 浅色' : '🌙 深色';
      }
      themeToggle.addEventListener('click', () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));
      inspirationRenderingHelp.addEventListener('click', () => {
        const open = inspirationRenderingTooltipWrap.classList.toggle('open');
        inspirationRenderingHelp.setAttribute('aria-expanded', String(open));
      });
      document.addEventListener('click', (event) => {
        if (inspirationRenderingTooltipWrap.contains(event.target)) return;
        inspirationRenderingTooltipWrap.classList.remove('open'); inspirationRenderingHelp.setAttribute('aria-expanded', 'false');
      });
      inspirationRenderingHelp.addEventListener('keydown', (event) => {
        if (event.key !== 'Escape') return;
        inspirationRenderingTooltipWrap.classList.remove('open'); inspirationRenderingHelp.setAttribute('aria-expanded', 'false'); inspirationRenderingHelp.blur();
      });
      memoryCategory.addEventListener('change', loadMemories);
      memorySortOrder.addEventListener('change', loadMemories);
      memoryModeButtons.forEach((button) => {
        button.addEventListener('click', () => syncMemorySquareMode(button.dataset.mode));
      });
      document.getElementById('random-memory-refresh').addEventListener('click', () => {
        if (memorySquareMode === 'random') renderRandomMemory();
      });
      calendarPrevious.addEventListener('click', () => shiftCalendarMonth(-1));
      calendarNext.addEventListener('click', () => shiftCalendarMonth(1));
      calendarToday.addEventListener('click', async () => {
        const today = applicationToday(); calendarYear = Number(today.slice(0, 4)); calendarMonth = Number(today.slice(5, 7)); selectedCalendarDate = today;
        await loadCalendarMonth(); selectCalendarDay(today);
      });
      calendarSortOrder.addEventListener('change', () => { if (selectedCalendarDate) loadCalendarDay(selectedCalendarDate); });
      authForm.addEventListener('submit', (event) => { event.preventDefault(); authenticate('login'); });
      registerButton.addEventListener('click', () => authenticate('register'));
      logoutButton.addEventListener('click', async () => { try { await request('/api/auth/logout', { method: 'POST' }); } finally { showAuth(); } });
      setTheme(localStorage.getItem('memory-agent-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
      if (accessToken) request('/api/auth/me').then(showApp).catch(() => showAuth('登录已过期，请重新登录。')); else showAuth();
    </script>
  </body>
</html>
